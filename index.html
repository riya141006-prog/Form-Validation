<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Concert Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="bg-noise"></div>
  <div class="bg-glow"></div>

  <div class="wrapper">

    <!-- LEFT PANEL -->
    <div class="panel-left">
      <div class="badge">🎸 LIVE EVENT</div>
      <h1 class="brand">SONIC<br><span>RUSH</span><br>2026</h1>
      <p class="tagline">Register now. Feel the stage shake.</p>
      <div class="steps">
        <div class="step active" id="step-dot-1"><span>1</span> Identity</div>
        <div class="step" id="step-dot-2"><span>2</span> Security</div>
        <div class="step" id="step-dot-3"><span>3</span> Contact</div>
      </div>
    </div>

    <!-- RIGHT PANEL (FORM) -->
    <div class="panel-right">
      <form id="regForm" novalidate>

        <!-- STEP 1: Identity -->
        <div class="form-step active" id="form-step-1">
          <h2 class="step-title">Your Identity</h2>

          <div class="row-3">
            <div class="field">
              <label>Prefix</label>
              <select id="prefix" name="prefix">
                <option value="">--</option>
                <option>Mr.</option>
                <option>Ms.</option>
                <option>Mrs.</option>
                <option>Dr.</option>
                <option>Prof.</option>
              </select>
              <span class="err" id="err-prefix"></span>
            </div>
            <div class="field span2">
              <label>First Name</label>
              <input type="text" id="firstName" placeholder="e.g. Alex" />
              <span class="err" id="err-firstName"></span>
            </div>
          </div>

          <div class="row-2">
            <div class="field">
              <label>Last Name</label>
              <input type="text" id="lastName" placeholder="e.g. Rivera" />
              <span class="err" id="err-lastName"></span>
            </div>
            <div class="field">
              <label>Username</label>
              <input type="text" id="username" placeholder="e.g. alex_r26" />
              <span class="err" id="err-username"></span>
            </div>
          </div>

          <div class="row-3">
            <div class="field">
              <label>Date of Birth</label>
              <input type="date" id="dob" />
              <span class="err" id="err-dob"></span>
            </div>
            <div class="field">
              <label>Age</label>
              <input type="number" id="age" placeholder="Auto" readonly />
              <span class="err" id="err-age"></span>
            </div>
            <div class="field">
              <label>Gender</label>
              <select id="gender">
                <option value="">Select</option>
                <option>Male</option>
                <option>Female</option>
                <option>Non-binary</option>
                <option>Prefer not to say</option>
              </select>
              <span class="err" id="err-gender"></span>
            </div>
          </div>

          <button type="button" class="btn-next" onclick="goNext(1)">Next →</button>
        </div>

        <!-- STEP 2: Security -->
        <div class="form-step" id="form-step-2">
          <h2 class="step-title">Set Password</h2>

          <div class="field">
            <label>Password</label>
            <div class="input-eye">
              <input type="password" id="password" placeholder="Min 8 chars, 1 number, 1 symbol" />
              <button type="button" class="eye-btn" onclick="togglePass('password', this)">👁</button>
            </div>
            <div class="strength-bar"><div id="strength-fill"></div></div>
            <span class="strength-label" id="strength-label"></span>
            <span class="err" id="err-password"></span>
          </div>

          <div class="field">
            <label>Confirm Password</label>
            <div class="input-eye">
              <input type="password" id="confirmPassword" placeholder="Repeat password" />
              <button type="button" class="eye-btn" onclick="togglePass('confirmPassword', this)">👁</button>
            </div>
            <span class="err" id="err-confirmPassword"></span>
          </div>

          <div class="row-2 btn-row">
            <button type="button" class="btn-back" onclick="goBack(2)">← Back</button>
            <button type="button" class="btn-next" onclick="goNext(2)">Next →</button>
          </div>
        </div>

        <!-- STEP 3: Contact -->
        <div class="form-step" id="form-step-3">
          <h2 class="step-title">Contact Info</h2>

          <div class="field">
            <label>Email Address</label>
            <input type="email" id="email" placeholder="you@example.com" />
            <span class="err" id="err-email"></span>
          </div>

          <div class="field">
            <label>Contact Number</label>
            <div class="phone-wrap">
              <span class="country-code">+91</span>
              <input type="tel" id="phone" placeholder="10-digit mobile number" maxlength="10" />
            </div>
            <span class="err" id="err-phone"></span>
          </div>

          <div class="row-2 btn-row">
            <button type="button" class="btn-back" onclick="goBack(3)">← Back</button>
            <button type="submit" class="btn-submit">Register 🎟</button>
          </div>
        </div>

      </form>

      <!-- SUCCESS -->
      <div class="success-screen" id="successScreen">
        <div class="check-anim">✔</div>
        <h2>You're In!</h2>
        <p id="success-msg"></p>
        <button onclick="resetForm()" class="btn-next">Register Another</button>
      </div>

    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
